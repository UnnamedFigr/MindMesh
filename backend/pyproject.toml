[project]
name = "mindmesh-backend"
version = "0.1.0"
description = "MindMesh - YouTube Study Guide Generator API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "supabase>=2.10.0",
    "httpx>=0.28.0",
    "openai>=1.60.0",
    "tiktoken>=0.8.0",
    "youtube-transcript-api>=1.0.0",
    "yt-dlp>=2025.1.15",
    "jinja2>=3.1.4",
    "tenacity>=9.0.0",
    "python-jose[cryptography]>=3.3.0",
    "sentry-sdk[fastapi]>=2.19.0",
    "structlog>=24.4.0",
    "stripe>=11.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "black>=24.10.0",
    "httpx>=0.28.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
